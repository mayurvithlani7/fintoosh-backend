app = "fintoosh-backend"
primary_region = "bom"  # Mumbai region for better latency

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["paketobuildpacks/nodejs"]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
